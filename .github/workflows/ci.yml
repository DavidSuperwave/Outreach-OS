name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install workspace dependencies
        run: pnpm install

      - name: Install kernel (cloudflare-os) dependencies
        run: pnpm --dir cloudflare-os install

      - name: Build @gadgets/typed-storage (required by identity kernel-DO tests)
        run: pnpm --dir cloudflare-os --filter @gadgets/typed-storage build

      - name: Run governance checks
        run: pnpm governance

      - name: Run tests
        run: pnpm test
